<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPC 中台 · 顶部栏全局搜索原型</title>
<style>
  :root {
    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-border: #e2e8f0;
    --color-text: #0f172a;
    --color-text-muted: #475569;
    --color-text-faint: #94a3b8;
    --color-sidebar: #0f172a;
    --color-sidebar-text: #cbd5e1;
    --color-brand: #6366f1;
    --color-highlight: #fef08a;
    --color-hover: #f1f5f9;
    --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.16);
    --radius: 8px;
    --radius-card: 12px;
    --radius-full: 999px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }

  .app { display: flex; height: 100vh; }

  /* === 侧栏 === */
  .sidebar {
    width: 256px;
    background: var(--color-sidebar);
    color: var(--color-sidebar-text);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width .2s;
  }
  .sidebar.collapsed { width: 80px; }
  .sidebar .logo {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    overflow: hidden;
  }
  .sidebar .logo-mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
    flex-shrink: 0;
  }
  .sidebar .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .sidebar .logo-text b { color: #fff; font-size: 16px; letter-spacing: .5px; }
  .sidebar .logo-text span { color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .sidebar.collapsed .logo-text { display: none; }
  .sidebar nav { flex: 1; padding: 8px 12px; overflow-y: auto; }
  .sidebar nav .nav-group { margin-bottom: 4px; }
  .sidebar nav .nav-group-title {
    padding: 8px 12px 4px;
    font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;
  }
  .sidebar.collapsed nav .nav-group-title { display: none; }
  .sidebar nav .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--color-sidebar-text);
    cursor: pointer;
    font-size: 14px;
    transition: background .15s;
  }
  .sidebar nav .nav-item:hover { background: rgba(99, 102, 241, .15); color: #fff; }
  .sidebar nav .nav-item.active { background: var(--color-brand); color: #fff; }
  .sidebar nav .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar.collapsed nav .nav-item .nav-text { display: none; }
  .sidebar.collapsed nav .nav-item { justify-content: center; padding: 8px; }

  /* === 主区 === */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* === 顶部栏 === */
  .topbar {
    height: 56px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar .collapse-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: var(--color-text-muted);
    transition: background .15s;
  }
  .topbar .collapse-btn:hover { background: var(--color-hover); }

  .topbar .crumb {
    color: var(--color-text-muted);
    font-size: 14px;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }
  .topbar .crumb b { color: var(--color-text); font-weight: 600; }
  .topbar .crumb .sep { color: var(--color-text-faint); }

  /* 中部搜索框（新增） */
  .topbar .search-box {
    flex: 1;
    max-width: 480px;
    margin: 0 auto;
    height: 32px;
    display: flex; align-items: center;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 0 12px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    gap: 8px;
  }
  .topbar .search-box:hover { border-color: #cbd5e1; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .topbar .search-box .search-icon { color: var(--color-text-faint); flex-shrink: 0; }
  .topbar .search-box .placeholder { color: var(--color-text-faint); font-size: 14px; flex: 1; }
  .topbar .search-box .kbd {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px 6px;
    background: #f1f5f9;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--color-text-muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .topbar .actions {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .topbar .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: var(--color-text-muted);
    position: relative;
    transition: background .15s;
  }
  .topbar .icon-btn:hover { background: var(--color-hover); }
  .topbar .icon-btn .badge {
    position: absolute; top: 4px; right: 4px;
    min-width: 16px; height: 16px;
    background: #ef4444;
    color: #fff;
    border-radius: var(--radius-full);
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }
  .topbar .avatar {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s;
  }
  .topbar .avatar:hover { background: var(--color-hover); }
  .topbar .avatar .avatar-circle {
    width: 28px; height: 28px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .topbar .avatar .avatar-name { font-size: 14px; color: var(--color-text); }

  /* 主内容（占位） */
  .content { flex: 1; padding: 24px; overflow-y: auto; background: var(--color-bg); }
  .content .placeholder-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-card);
    padding: 32px;
    text-align: center;
    color: var(--color-text-muted);
  }
  .content .placeholder-card h2 { font-size: 18px; margin-bottom: 8px; color: var(--color-text); }
  .content .placeholder-card p { font-size: 14px; margin-bottom: 4px; }
  .content .hint-row {
    margin-top: 16px;
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .content .hint-row code {
    background: #f1f5f9; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; color: var(--color-text-muted);
  }

  /* === Command Palette 弹层 === */
  .palette-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.3);
    display: none;
    z-index: 1000;
    align-items: flex-start; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .palette-overlay.open { display: flex; }
  .palette {
    width: 640px;
    max-width: 92vw;
    margin-top: 12vh;
    background: var(--color-surface);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-panel);
    overflow: hidden;
    display: flex; flex-direction: column;
    max-height: 76vh;
  }
  .palette .palette-input-wrap {
    display: flex; align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--color-border);
    gap: 12px;
  }
  .palette .palette-input-wrap .search-icon { color: var(--color-text-faint); flex-shrink: 0; }
  .palette .palette-input {
    flex: 1;
    border: none; outline: none;
    padding: 16px 0;
    font-size: 16px;
    font-family: inherit;
    background: transparent;
    color: var(--color-text);
  }
  .palette .palette-input::placeholder { color: var(--color-text-faint); }
  .palette .palette-close {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    color: var(--color-text-faint);
    transition: background .15s, color .15s;
  }
  .palette .palette-close:hover { background: var(--color-hover); color: var(--color-text); }

  .palette .palette-results {
    flex: 1; overflow-y: auto;
    padding: 8px 0;
  }
  .palette .group-title {
    padding: 8px 16px 4px;
    font-size: 11px;
    color: var(--color-text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .palette .result-item {
    display: flex; align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    gap: 12px;
    border-left: 2px solid transparent;
    transition: background .1s;
  }
  .palette .result-item.selected {
    background: var(--color-hover);
    border-left-color: var(--color-brand);
  }
  .palette .result-item .result-icon {
    width: 16px; height: 16px;
    color: var(--color-text-muted);
    flex-shrink: 0;
  }
  .palette .result-item .result-title {
    font-size: 14px; color: var(--color-text);
    flex-shrink: 0;
  }
  .palette .result-item .result-title mark {
    background: var(--color-highlight);
    color: inherit;
    padding: 0 1px;
    border-radius: 2px;
  }
  .palette .result-item .result-meta {
    font-size: 12px;
    color: var(--color-text-faint);
    margin-left: auto;
    flex-shrink: 0;
  }
  .palette .result-item .result-meta .module-tag {
    background: #f1f5f9;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    color: var(--color-text-muted);
  }
  .palette .result-item .result-meta .path {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .palette .empty-hint {
    padding: 24px 16px;
    text-align: center;
    color: var(--color-text-faint);
    font-size: 14px;
  }

  .palette .palette-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    border-top: 1px solid var(--color-border);
    background: #fafbfc;
    font-size: 12px;
    color: var(--color-text-faint);
  }
  .palette .palette-footer .keys { display: flex; gap: 12px; }
  .palette .palette-footer .keys span { display: inline-flex; align-items: center; gap: 4px; }
  .palette .palette-footer .keys kbd {
    display: inline-block;
    padding: 1px 5px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 3px;
    font-size: 11px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--color-text-muted);
  }
  .palette .palette-footer .footer-actions { display: flex; align-items: center; gap: 12px; }
  .palette .palette-footer .reset-btn {
    background: none; border: none;
    color: var(--color-text-faint);
    cursor: pointer;
    font-size: 12px;
    text-decoration: underline;
    font-family: inherit;
  }
  .palette .palette-footer .reset-btn:hover { color: var(--color-text-muted); }

  /* 跳转成功提示 */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    z-index: 2000;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <!-- 侧栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">S</div>
      <div class="logo-text">
        <b>SPC 中台</b>
        <span>供应链协同</span>
      </div>
    </div>
    <nav>
      <div class="nav-group">
        <div class="nav-group-title">概览</div>
        <div class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span class="nav-text">仪表板</span>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">业务</div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11H5a2 2 0 0 0-2 2v7h18v-7a2 2 0 0 0-2-2h-4"/><rect x="9" y="3" width="6" height="11" rx="1"/></svg>
          <span class="nav-text">销售订单</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h20M5 20V8l7-5 7 5v12M9 20v-6h6v6"/></svg>
          <span class="nav-text">生产订单</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
          <span class="nav-text">物料需求</span>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">系统</div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-text">用户管理</span>
        </div>
      </div>
    </nav>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <!-- 顶部栏 -->
    <div class="topbar">
      <div class="collapse-btn" id="collapseBtn" title="收起侧栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </div>
      <div class="crumb">
        <span>首页</span>
        <span class="sep">/</span>
        <b>订单管理</b>
      </div>
      <!-- 新增：中部搜索框 -->
      <div class="search-box" id="searchBox" title="搜索页面（Ctrl+K）">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="placeholder">搜索页面…</span>
        <span class="kbd">Ctrl K</span>
      </div>
      <div class="actions">
        <div class="icon-btn" title="通知中心">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge">3</span>
        </div>
        <div class="avatar" title="张三 · 计划员">
          <div class="avatar-circle">张</div>
          <span class="avatar-name">张三</span>
        </div>
      </div>
    </div>

    <!-- 主内容（占位演示） -->
    <div class="content">
      <div class="placeholder-card">
        <h2>顶部栏全局搜索 — 原型演示</h2>
        <p>这是主内容区占位。原型重点演示顶部栏中部搜索框与 Command Palette 弹层。</p>
        <p>下方是测试入口：</p>
        <div class="hint-row">
          <code>Ctrl + K</code>
          <code>或点击顶部栏中部搜索框</code>
        </div>
        <p style="margin-top:12px;font-size:13px;color:var(--color-text-faint)">支持中文子串、拼音首字母（如 xsdd → 销售订单）、模糊匹配</p>
      </div>
    </div>
  </div>
</div>

<!-- Command Palette 弹层 -->
<div class="palette-overlay" id="paletteOverlay">
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="全局搜索">
    <div class="palette-input-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="palette-input" id="paletteInput" placeholder="搜索页面（标题、路径或拼音首字母）…" autocomplete="off" />
      <div class="palette-close" id="paletteClose" title="关闭 (Esc)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>
    <div class="palette-results" id="paletteResults"></div>
    <div class="palette-footer">
      <div class="keys">
        <span><kbd>↑</kbd><kbd>↓</kbd> 导航</span>
        <span><kbd>↵</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
      <div class="footer-actions">
        <button class="reset-btn" id="resetRecentBtn" title="清空 localStorage">重置最近访问</button>
        <span id="resultCount">共 0 个结果</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ===== Mock 数据：模拟 permission tree 叶子节点 =====
  var PAGES = [
    { title: '仪表板',          route_path: '/dashboard',                module: '仪表板',   pinyin: 'ybb' },
    { title: '销售订单',        route_path: '/order/list',               module: '订单',     pinyin: 'xsdd' },
    { title: '销售订单详情',    route_path: '/order/detail',             module: '订单',     pinyin: 'xsddxq' },
    { title: '生产订单',        route_path: '/production/list',          module: '生产',     pinyin: 'scdd' },
    { title: '生产订单详情',    route_path: '/production/detail',        module: '生产',     pinyin: 'scddxq' },
    { title: '物料需求',        route_path: '/material/requirement',     module: '物料',     pinyin: 'wlxq' },
    { title: '问题物料',        route_path: '/material/issues',         module: '物料',     pinyin: 'twl' },
    { title: '长交期物料',      route_path: '/material/long-lead',       module: '物料',     pinyin: 'cjqwl' },
    { title: '客户管理',        route_path: '/basicdata/customer',       module: '基础数据', pinyin: 'khgl' },
    { title: '供应商管理',      route_path: '/basicdata/supplier',       module: '基础数据', pinyin: 'gysgl' },
    { title: '审批待办',        route_path: '/approval/pending',         module: '审批',     pinyin: 'spdb' },
    { title: '审批配置',        route_path: '/approval/config',         module: '审批',     pinyin: 'sppz' },
    { title: '风险扫描',        route_path: '/exception/risk',           module: '异常',     pinyin: 'fxsm' },
    { title: '超期检查',        route_path: '/exception/overdue',       module: '异常',     pinyin: 'cqjc' },
    { title: '调价单',          route_path: '/price-adjustment/list',    module: '订单',     pinyin: 'tjd' },
    { title: '角色管理',        route_path: '/system/role',             module: '系统',     pinyin: 'jsgl' },
    { title: '用户管理',        route_path: '/system/user',             module: '系统',     pinyin: 'yhgl' },
    { title: '部署版本',        route_path: '/system/deploy-versions',  module: '系统',     pinyin: 'bsbb' },
    { title: '站内信',          route_path: '/notifications',            module: '个人',     pinyin: 'znx' },
    { title: '个人中心',        route_path: '/profile',                 module: '个人',     pinyin: 'grzx' }
  ];

  // 给每项一个稳定 id
  PAGES.forEach(function (p, i) { p.id = i; });

  var RECENT_KEY = 'spc_global_search_recent';
  var RECENT_MAX = 5;

  function getRecent() {
    try {
      var raw = localStorage.getItem(RECENT_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) {}
    // 首次访问的 mock 初始数据
    return ['/dashboard', '/order/list', '/material/requirement', '/approval/pending', '/system/role'];
  }

  function saveRecent(list) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function pushRecent(routePath) {
    var list = getRecent().filter(function (p) { return p !== routePath; });
    list.unshift(routePath);
    if (list.length > RECENT_MAX) list = list.slice(0, RECENT_MAX);
    saveRecent(list);
  }

  function resetRecent() {
    try { localStorage.removeItem(RECENT_KEY); } catch (e) {}
  }

  // ===== Fuzzy match + score =====
  // 返回 { score, indices, pinyin }
  // score 为 0 表示不命中
  function fuzzyMatch(query, page) {
    var q = query.trim().toLowerCase();
    if (!q) return { score: 1, indices: [], pinyin: false };
    var t = page.title.toLowerCase();
    var path = page.route_path.toLowerCase();

    // 1) 标题子串直接命中
    var idx = t.indexOf(q);
    if (idx >= 0) {
      var score = 30 + q.length * 5;
      if (idx === 0) score += 20;
      var indices = [];
      for (var i = 0; i < q.length; i++) indices.push(idx + i);
      return { score: score, indices: indices, pinyin: false };
    }

    // 2) 路径子串命中（如 ord 命中 /order/list）
    var pidx = path.indexOf(q);
    if (pidx >= 0) {
      var pScore = 15 + q.length * 3;
      return { score: pScore, indices: [], pinyin: false, pathMatch: true };
    }

    // 3) 拼音首字母命中（如 xsdd 命中 销售订单）
    if (page.pinyin) {
      var p = page.pinyin;
      var ppidx = p.indexOf(q);
      if (ppidx >= 0) {
        var ppScore = 20 + q.length * 4;
        if (ppidx === 0) ppScore += 15;
        return { score: ppScore, indices: [], pinyin: true };
      }
    }

    // 4) 模糊匹配（字符顺序出现，可不连续）
    var ti = 0, fIndices = [];
    for (var qi = 0; qi < q.length; qi++) {
      var found = false;
      while (ti < t.length) {
        if (t.charAt(ti) === q.charAt(qi)) {
          fIndices.push(ti);
          found = true;
          ti++;
          break;
        }
        ti++;
      }
      if (!found) return { score: 0, indices: [], pinyin: false };
    }
    // 连续字符奖励
    var consec = 1, maxConsec = 1;
    for (var k = 1; k < fIndices.length; k++) {
      if (fIndices[k] === fIndices[k - 1] + 1) {
        consec++;
        if (consec > maxConsec) maxConsec = consec;
      } else {
        consec = 1;
      }
    }
    var fScore = 5 + q.length * 2 + maxConsec * 4;
    return { score: fScore, indices: fIndices, pinyin: false };
  }

  // ===== 状态 =====
  var state = {
    open: false,
    query: '',
    recentList: getRecent(),
    flatResults: [],   // 当前展示的扁平结果数组（含 score、原 page、match 信息）
    selectedIndex: 0
  };

  var $overlay = document.getElementById('paletteOverlay');
  var $palette = document.getElementById('palette');
  var $input = document.getElementById('paletteInput');
  var $results = document.getElementById('paletteResults');
  var $count = document.getElementById('resultCount');
  var $searchBox = document.getElementById('searchBox');
  var $closeBtn = document.getElementById('paletteClose');
  var $resetBtn = document.getElementById('resetRecentBtn');
  var $collapseBtn = document.getElementById('collapseBtn');
  var $sidebar = document.getElementById('sidebar');
  var $toast = document.getElementById('toast');

  // ===== 渲染辅助 =====
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 给标题加上 <mark> 高亮命中字符
  function highlightTitle(title, indices) {
    if (!indices || indices.length === 0) return escapeHtml(title);
    var set = {};
    indices.forEach(function (i) { set[i] = true; });
    var out = '';
    for (var i = 0; i < title.length; i++) {
      var ch = title.charAt(i);
      var safe = ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch;
      if (set[i]) out += '<mark>' + safe + '</mark>';
      else out += safe;
    }
    return out;
  }

  function fileIconSvg() {
    return '<svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  }

  function clockIconSvg() {
    return '<svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  }

  // 计算当前应展示的结果集
  function computeResults() {
    var q = state.query.trim().toLowerCase();
    var recent = state.recentList;
    var recentSet = {};
    recent.forEach(function (p) { recentSet[p] = true; });

    if (!q) {
      // 空输入：最近访问组 + 全部页面按 module 分组
      var recentPages = recent
        .map(function (rp) { return PAGES.find(function (p) { return p.route_path === rp; }); })
        .filter(Boolean);
      var allPages = PAGES.slice();

      var flat = [];
      recentPages.forEach(function (p) {
        flat.push({ page: p, score: 0, indices: [], isRecent: true, group: '最近访问' });
      });
      // 按 module 分组
      var modules = [];
      var byModule = {};
      allPages.forEach(function (p) {
        if (!byModule[p.module]) { byModule[p.module] = []; modules.push(p.module); }
        byModule[p.module].push(p);
      });
      modules.forEach(function (m) {
        byModule[m].forEach(function (p) {
          flat.push({ page: p, score: 0, indices: [], isRecent: false, group: m });
        });
      });
      return flat;
    }

    // 有关键字：扁平按 score 降序，最近访问命中加权
    var matched = [];
    PAGES.forEach(function (p) {
      var m = fuzzyMatch(q, p);
      if (m.score > 0) {
        var isRecent = !!recentSet[p.route_path];
        var finalScore = m.score + (isRecent ? 50 : 0);
        matched.push({ page: p, score: finalScore, indices: m.indices, isRecent: isRecent, pinyin: m.pinyin, pathMatch: m.pathMatch });
      }
    });
    matched.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.page.title.length - b.page.title.length;
    });
    return matched;
  }

  function render() {
    state.flatResults = computeResults();
    state.selectedIndex = state.flatResults.length > 0 ? Math.min(state.selectedIndex, state.flatResults.length - 1) : 0;

    var html = '';
    if (state.flatResults.length === 0) {
      html = '<div class="empty-hint">未找到匹配的页面</div>';
    } else if (!state.query.trim()) {
      // 分组渲染
      var lastGroup = null;
      state.flatResults.forEach(function (item, idx) {
        if (item.group !== lastGroup) {
          html += '<div class="group-title">' + escapeHtml(item.group) + '</div>';
          lastGroup = item.group;
        }
        html += renderItem(item, idx);
      });
    } else {
      // 扁平列表，带 score；最近访问命中标星
      state.flatResults.forEach(function (item, idx) {
        var prefix = item.isRecent ? '<span style="color:#6366f1;font-size:12px;margin-right:4px" title="最近访问">★</span>' : '';
        html += renderItem(item, idx, prefix);
      });
    }
    $results.innerHTML = html;
    $count.textContent = '共 ' + state.flatResults.length + ' 个结果';
    bindResultItems();
    scrollSelectedIntoView();
  }

  function renderItem(item, idx, prefix) {
    var p = item.page;
    var titleHtml = highlightTitle(p.title, item.indices);
    if (item.pinyin) {
      // 拼音命中时附加提示
      titleHtml += '<span style="color:#94a3b8;font-size:11px;margin-left:6px">[' + escapeHtml(p.pinyin) + ']</span>';
    }
    var icon = item.isRecent ? clockIconSvg() : fileIconSvg();
    return '<div class="result-item' + (idx === state.selectedIndex ? ' selected' : '') + '" data-idx="' + idx + '">' +
      icon +
      (prefix || '') +
      '<span class="result-title">' + titleHtml + '</span>' +
      '<span class="result-meta">' +
        '<span class="module-tag">' + escapeHtml(p.module) + '</span>' +
        '<span class="path">' + escapeHtml(p.route_path) + '</span>' +
      '</span>' +
      '</div>';
  }

  function bindResultItems() {
    var items = $results.querySelectorAll('.result-item');
    items.forEach(function (el) {
      el.addEventListener('mouseenter', function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        if (!isNaN(idx) && state.selectedIndex !== idx) {
          state.selectedIndex = idx;
          updateSelectedClass();
        }
      });
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        if (!isNaN(idx)) openItem(state.flatResults[idx]);
      });
    });
  }

  function updateSelectedClass() {
    var items = $results.querySelectorAll('.result-item');
    items.forEach(function (el, i) {
      if (i === state.selectedIndex) el.classList.add('selected');
      else el.classList.remove('selected');
    });
  }

  function scrollSelectedIntoView() {
    var el = $results.querySelector('.result-item.selected');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  // ===== 交互 =====
  function openPalette() {
    state.open = true;
    state.query = '';
    state.recentList = getRecent();
    state.selectedIndex = 0;
    $overlay.classList.add('open');
    $input.value = '';
    render();
    setTimeout(function () { $input.focus(); }, 10);
  }

  function closePalette() {
    state.open = false;
    $overlay.classList.remove('open');
  }

  function openItem(item) {
    if (!item) return;
    pushRecent(item.page.route_path);
    state.recentList = getRecent();
    showToast('跳转到 ' + item.page.route_path + '（' + item.page.title + '）');
    closePalette();
  }

  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    setTimeout(function () { $toast.classList.remove('show'); }, 1800);
  }

  function moveSelection(delta) {
    var n = state.flatResults.length;
    if (n === 0) return;
    state.selectedIndex = (state.selectedIndex + delta + n) % n;
    updateSelectedClass();
    scrollSelectedIntoView();
  }

  // ===== 事件绑定 =====
  $searchBox.addEventListener('click', openPalette);
  $closeBtn.addEventListener('click', closePalette);
  $overlay.addEventListener('click', function (e) {
    if (e.target === $overlay) closePalette();
  });
  $input.addEventListener('input', function () {
    state.query = $input.value;
    state.selectedIndex = 0;
    render();
  });
  $input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); openItem(state.flatResults[state.selectedIndex]); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  });
  $resetBtn.addEventListener('click', function () {
    resetRecent();
    state.recentList = getRecent();
    render();
    showToast('已重置最近访问');
  });
  $collapseBtn.addEventListener('click', function () {
    $sidebar.classList.toggle('collapsed');
  });

  // 全局快捷键
  document.addEventListener('keydown', function (e) {
    // Ctrl+K 或 Cmd+K
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (state.open) closePalette();
      else openPalette();
      return;
    }
    // 当弹层关闭时，按 / 直接打开并预填
    if (!state.open && e.key === '/' && document.activeElement !== $input) {
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        openPalette();
      }
    }
    // esc 关闭
    if (e.key === 'Escape' && state.open) {
      e.preventDefault();
      closePalette();
    }
  });

  // 初始 mock 提示
  console.log('[原型] 全局搜索已就绪。按 Ctrl+K 打开。');
})();
</script>
</body>
</html>
