services:
  backend:
    build:
      context: ./backend
      additional_contexts:
        # 订单写操作注册表唯一源（agents/shared），构建时注入 backend 镜像
        agents_shared: ./agents/shared
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      SERVER_ID: ${SERVER_ID:-spc-dev}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ERP_DB_URL: ${ERP_DB_URL}
      ERP_DB_SCHEMA: ${ERP_DB_SCHEMA}
      ERP_SYNC_ENABLED: ${ERP_SYNC_ENABLED:-false}
      ERP_SYNC_BATCH_SIZE: ${ERP_SYNC_BATCH_SIZE}
      ERP_SYNC_DEFAULT_PASSWORD: ${ERP_SYNC_DEFAULT_PASSWORD}
      # K3 账套分离：K3_DB=同步/读取(默认生产)；K3_WRITE_DB=回写目标(空则回落 K3_DB)
      K3_DB: ${K3_DB:-k3sv.AIS20161019115614}
      K3_WRITE_DB: ${K3_WRITE_DB:-}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/uploads}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-spc-files}
      # 留空时自动复用 MinIO 容器凭据（MINIO_ROOT_USER/PASSWORD）
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_SECURE: ${STORAGE_S3_SECURE:-false}
      # AI Service Configuration
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-rule_based}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30}
      # 推理专用模型（留空沿用 AI_OPENAI_MODEL；建议 flash 档压时延）
      REASONING_MODEL: ${REASONING_MODEL:-}
      UPPH_MATCH_MODE: ${UPPH_MATCH_MODE}
      # WeCom (企业微信)
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_CONTACT_SECRET: ${WECOM_CONTACT_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # === 回写功能（新增）===
      ERP_DB_URL_WRITE: ${ERP_DB_URL_WRITE:-}
      WRITEBACK_ENABLED: ${WRITEBACK_ENABLED:-}
      WRITEBACK_POLL_INTERVAL: ${WRITEBACK_POLL_INTERVAL:-}
      WRITEBACK_BATCH_SIZE: ${WRITEBACK_BATCH_SIZE:-}
      WRITEBACK_CLAIM_TIMEOUT: ${WRITEBACK_CLAIM_TIMEOUT:-}
      # 执行面单一网关（全部 Hub HTTP 与 resolve-caller 统一出口）
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://aeos-gateway:8790}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-}
      GATEWAY_CALLER_USER_ID_FIELD: ${GATEWAY_CALLER_USER_ID_FIELD:-emp_code}
      GATEWAY_HUB_TIMEOUT_S: ${GATEWAY_HUB_TIMEOUT_S:-20}
      # 执行面智能体 admin 面代理地址（query/reasoning/写 均由网关承载）
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      EXECUTION_QUERY_AGENT_BASE_URL: ${EXECUTION_QUERY_AGENT_BASE_URL:-http://aeos-gateway:8790}
      EXECUTION_REASONING_AGENT_BASE_URL: ${EXECUTION_REASONING_AGENT_BASE_URL:-http://aeos-gateway:8790}
      EXECUTION_WRITE_AGENT_BASE_URL: ${EXECUTION_WRITE_AGENT_BASE_URL:-http://aeos-gateway:8790}
      # AEOS Hub 助手观测上报（assistant-events，中台智能助手调用留痕；缺一即停用）
      AEOS_HUB_BASE: ${AEOS_HUB_BASE:-}
      AEOS_SYSTEM_ID: ${AEOS_SYSTEM_ID:-}
      AEOS_SYSTEM_TOKEN: ${AEOS_SYSTEM_TOKEN:-}
      AEOS_HUB_CA_CERT: ${AEOS_HUB_CA_CERT:-/app/certs/caddy-root.crt}
    extra_hosts:
      - "aeos-hub.test:${AEOS_HUB_IP:-192.168.0.23}"
    volumes:
      - ./data/uploads:${STORAGE_LOCAL_ROOT:-/app/uploads}
      - ./data/backups:/app/backups
      #python init_database.py &&
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # AEOS Hub 单一系统网关（agents/gateway-agent，唯一 Hub WS 身份，内置 query/reasoning 适配器）：
  # 启动：docker compose --profile aeos up -d aeos-gateway
  # 必须单副本：多副本会以同一 agentId 重复注册 Hub。
  aeos-gateway:
    build:
      context: ./agents
      dockerfile: gateway-agent/Dockerfile
    image: aeos-gateway:latest
    profiles: ["aeos"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      EXECUTION_AGENT_KEY: gateway
      EXECUTION_WS_URL: ${EXECUTION_WS_URL:-}
      # 网关使用系统令牌（EXECUTION_SYSTEM_ID/TOKEN）；legacy 根令牌可留空
      EXECUTION_PLANE_TOKEN: ${EXECUTION_PLANE_TOKEN:-}
      EXECUTION_AGENT_ID: ${GATEWAY_AGENT_ID:-gateway-control-platform}
      EXECUTION_AGENT_NAME: ${GATEWAY_AGENT_NAME:-公司中台系统网关}
      EXECUTION_SOURCE_SYSTEM: ${EXECUTION_SOURCE_SYSTEM:-control-platform}
      EXECUTION_SYSTEM_ID: ${AEOS_SYSTEM_ID:-control-platform}
      EXECUTION_SYSTEM_TOKEN: ${AEOS_SYSTEM_TOKEN:-}
      AEOS_SYSTEM_ID: ${AEOS_SYSTEM_ID:-control-platform}
      AEOS_SYSTEM_TOKEN: ${AEOS_SYSTEM_TOKEN:-}
      AEOS_HUB_BASE: ${AEOS_HUB_BASE:-}
      CONTROL_PLATFORM_BASE_URL: ${CONTROL_PLATFORM_BASE_URL:-http://backend:8000/api/v1}
      BACKEND_INTERNAL_BASE_URL: ${BACKEND_INTERNAL_BASE_URL:-http://backend:8000}
      CONTROL_PLATFORM_QUERY_APP_KEY: ${CONTROL_PLATFORM_QUERY_APP_KEY:-}
      CONTROL_PLATFORM_QUERY_APP_SECRET: ${CONTROL_PLATFORM_QUERY_APP_SECRET:-}
      CONTROL_PLATFORM_REASONING_APP_KEY: ${CONTROL_PLATFORM_REASONING_APP_KEY:-}
      CONTROL_PLATFORM_REASONING_APP_SECRET: ${CONTROL_PLATFORM_REASONING_APP_SECRET:-}
      CONTROL_PLATFORM_ORDER_APP_KEY: ${CONTROL_PLATFORM_ORDER_APP_KEY:-}
      CONTROL_PLATFORM_ORDER_APP_SECRET: ${CONTROL_PLATFORM_ORDER_APP_SECRET:-}
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:-}
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      CONTROL_PLATFORM_TIMEOUT_MS: ${CONTROL_PLATFORM_TIMEOUT_MS:-15000}
      CONTROL_PLATFORM_REASONING_TIMEOUT_MS: ${CONTROL_PLATFORM_REASONING_TIMEOUT_MS:-180000}
      CONTROL_PLATFORM_ORDER_TIMEOUT_MS: ${CONTROL_PLATFORM_ORDER_TIMEOUT_MS:-30000}
      GATEWAY_RESOLVER_TIMEOUT_MS: ${GATEWAY_RESOLVER_TIMEOUT_MS:-30000}
      HEALTH_CHECK_PORT: "8790"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AEOS_HUB_CA_CERT: ${AEOS_HUB_CA_CERT:-/app/certs/caddy-root.crt}
      NODE_EXTRA_CA_CERTS: /app/certs/caddy-root.crt
    extra_hosts:
      - "aeos-hub.test:${AEOS_HUB_IP:-192.168.0.23}"
    volumes:
      - ./backend/certs/caddy-root.crt:/app/certs/caddy-root.crt:ro
