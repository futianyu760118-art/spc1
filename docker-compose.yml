services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      SERVER_ID: ${SERVER_ID:-spc-dev}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ERP_DB_URL: ${ERP_DB_URL}
      ERP_DB_SCHEMA: ${ERP_DB_SCHEMA}
      ERP_SYNC_ENABLED: ${ERP_SYNC_ENABLED:-false}
      ERP_SYNC_BATCH_SIZE: ${ERP_SYNC_BATCH_SIZE}
      ERP_SYNC_DEFAULT_PASSWORD: ${ERP_SYNC_DEFAULT_PASSWORD}
      # K3 账套分离：K3_DB=同步/读取(默认生产)；K3_WRITE_DB=回写目标(空则回落 K3_DB)
      K3_DB: ${K3_DB:-k3sv.AIS20161019115614}
      K3_WRITE_DB: ${K3_WRITE_DB:-}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/uploads}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-spc-files}
      # 留空时自动复用 MinIO 容器凭据（MINIO_ROOT_USER/PASSWORD）
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_SECURE: ${STORAGE_S3_SECURE:-false}
      # AI Service Configuration
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-rule_based}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30}
      UPPH_MATCH_MODE: ${UPPH_MATCH_MODE}
      # WeCom (企业微信)
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_CONTACT_SECRET: ${WECOM_CONTACT_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # === 回写功能（新增）===
      ERP_DB_URL_WRITE: ${ERP_DB_URL_WRITE:-}
      WRITEBACK_ENABLED: ${WRITEBACK_ENABLED:-}
      WRITEBACK_POLL_INTERVAL: ${WRITEBACK_POLL_INTERVAL:-}
      WRITEBACK_BATCH_SIZE: ${WRITEBACK_BATCH_SIZE:-}
      WRITEBACK_CLAIM_TIMEOUT: ${WRITEBACK_CLAIM_TIMEOUT:-}
    volumes:
      - ./data/uploads:${STORAGE_LOCAL_ROOT:-/app/uploads}
      - ./data/backups:/app/backups
      #python init_database.py &&
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 执行面智能体（反向连 AEOS Hub）：默认不启动，需 `docker compose --profile agent up -d`
  # 且 .env 中已配置 EXECUTION_WS_URL / EXECUTION_PLANE_TOKEN / CONTROL_PLATFORM_* 才有意义
  execution-agent:
    build:
      context: .
      dockerfile: execution-agent/Dockerfile
    image: spc-execution-agent
    profiles: ["agent"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      EXECUTION_WS_URL: ${EXECUTION_WS_URL:-ws://127.0.0.1:8788/execution-agent}
      EXECUTION_PLANE_TOKEN: ${EXECUTION_PLANE_TOKEN:-}
      EXECUTION_AGENT_ID: ${EXECUTION_AGENT_ID:-runtime-execution-query}
      EXECUTION_SOURCE_SYSTEM: ${EXECUTION_SOURCE_SYSTEM:-}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-30000}
      CONTROL_PLATFORM_BASE_URL: ${CONTROL_PLATFORM_BASE_URL:-}
      CONTROL_PLATFORM_APP_KEY: ${CONTROL_PLATFORM_APP_KEY:-}
      CONTROL_PLATFORM_APP_SECRET: ${CONTROL_PLATFORM_APP_SECRET:-}
