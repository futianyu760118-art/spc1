services:
  postgres:
    image: postgres:15
    container_name: hj-spc-postgres
    # wal_level=logical 供 EDP 数据平台 CDC 逻辑复制（2026-10）；max_slot_wal_keep_size 为复制槽 WAL 保留设上限防磁盘涨满
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=20GB"]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spc_db
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d spc_db"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: hj-spc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      # 发布端口供纯应用服务器（docker-compose-app.yml）连接主服务器 Redis
      - "16379:6379"

  minio:
    image: minio/minio:latest
    container_name: hj-spc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 9000 API 供纯应用服务器 backend 连接（内网需放行）；9001 控制台
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    image: spc-v2-backend:latest
    ports:
      - "18085:8000"
    environment:
      TZ: Asia/Shanghai
      SERVER_ID: ${SERVER_ID:-spc-prod}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      ERP_DB_URL: ${ERP_DB_URL}
      ERP_DB_SCHEMA: ${ERP_DB_SCHEMA}
      ERP_SYNC_ENABLED: ${ERP_SYNC_ENABLED:-false}
      ERP_SYNC_BATCH_SIZE: ${ERP_SYNC_BATCH_SIZE}
      REDIS_URL: ${REDIS_URL}
      ERP_SYNC_DEFAULT_PASSWORD: ${ERP_SYNC_DEFAULT_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/uploads}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-spc-files}
      # 留空时自动复用 MinIO 容器凭据（MINIO_ROOT_USER/PASSWORD）
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_SECURE: ${STORAGE_S3_SECURE:-false}
      # AI Service Configuration
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-rule_based}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30}
      # 推理专用模型（留空沿用 AI_OPENAI_MODEL；建议 flash 档压时延）
      REASONING_MODEL: ${REASONING_MODEL:-}
      UPPH_MATCH_MODE: ${UPPH_MATCH_MODE}
      # WeCom (企业微信)
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_CONTACT_SECRET: ${WECOM_CONTACT_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # === 回写功能（新增）===
      ERP_DB_URL_WRITE: ${ERP_DB_URL_WRITE:-}
      WRITEBACK_ENABLED: ${WRITEBACK_ENABLED:-}
      WRITEBACK_POLL_INTERVAL: ${WRITEBACK_POLL_INTERVAL:-}
      WRITEBACK_BATCH_SIZE: ${WRITEBACK_BATCH_SIZE:-}
      WRITEBACK_CLAIM_TIMEOUT: ${WRITEBACK_CLAIM_TIMEOUT:-}
      # 执行面智能体（query/reasoning/order）admin 面代理地址
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      EXECUTION_QUERY_AGENT_BASE_URL: ${EXECUTION_QUERY_AGENT_BASE_URL:-http://aeos-query-agent:8790}
      EXECUTION_REASONING_AGENT_BASE_URL: ${EXECUTION_REASONING_AGENT_BASE_URL:-http://aeos-reasoning-agent:8790}
      EXECUTION_ORDER_AGENT_BASE_URL: ${EXECUTION_ORDER_AGENT_BASE_URL:-http://aeos-order-agent:8790}
      # AEOS Hub 助手观测上报（assistant-events，中台智能助手调用留痕；缺一即停用）
      AEOS_HUB_BASE: ${AEOS_HUB_BASE:-}
      AEOS_SYSTEM_ID: ${AEOS_SYSTEM_ID:-}
      AEOS_SYSTEM_TOKEN: ${AEOS_SYSTEM_TOKEN:-}
      AEOS_HUB_CA_CERT: ${AEOS_HUB_CA_CERT:-/app/certs/caddy-root.crt}
    extra_hosts:
      - "aeos-hub.test:${AEOS_HUB_IP:-192.168.0.23}"
    volumes:
      - ./data/uploads:${STORAGE_LOCAL_ROOT:-/app/uploads}
      - ./data/backups:/app/backups
    depends_on:
      - postgres
      - redis
      - minio
    command: >
      sh -c "python init_database.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: spc-v2-frontend:latest
    ports:
      - "18084:18084"
    volumes:
      # 企业微信可信域名校验文件
      - ./data/wecom_verify:/usr/share/nginx/html/wecom_verify:ro
      - ./data/nginx-ssl:/etc/nginx/ssl
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # AEOS Hub 执行面查询智能体（agents/query-agent，只注册 query_control_platform）。
  # 镜像需单独构建上传（见 agents/README.md）；EXECUTION_*/CONTROL_PLATFORM_* 配置在服务器 .env。
  aeos-query-agent:
    image: aeos-query-agent:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      EXECUTION_AGENT_KEY: query
      EXECUTION_WS_URL: ${EXECUTION_WS_URL:-}
      EXECUTION_PLANE_TOKEN: ${EXECUTION_PLANE_TOKEN:-}
      EXECUTION_AGENT_ID: ${EXECUTION_QUERY_AGENT_ID:-runtime-control-platform-query}
      EXECUTION_AGENT_NAME: ${EXECUTION_QUERY_AGENT_NAME:-公司中台查询智能体}
      EXECUTION_SOURCE_SYSTEM: ${EXECUTION_SOURCE_SYSTEM:-}
      CONTROL_PLATFORM_BASE_URL: ${CONTROL_PLATFORM_BASE_URL:-}
      CONTROL_PLATFORM_QUERY_APP_KEY: ${CONTROL_PLATFORM_QUERY_APP_KEY:-}
      CONTROL_PLATFORM_QUERY_APP_SECRET: ${CONTROL_PLATFORM_QUERY_APP_SECRET:-}
      CONTROL_PLATFORM_TIMEOUT_MS: ${CONTROL_PLATFORM_TIMEOUT_MS:-15000}
      HEALTH_CHECK_PORT: "8790"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      # 每系统令牌握手（Hub system-token 鉴权；配置后优先于 legacy 根令牌）
      EXECUTION_SYSTEM_ID: ${EXECUTION_SYSTEM_ID:-}
      EXECUTION_SYSTEM_TOKEN: ${EXECUTION_SYSTEM_TOKEN:-}

  # AEOS Hub 执行面推理智能体（agents/reasoning-agent，只注册 reason_control_platform）。
  # 镜像需单独构建上传（见 agents/README.md）；EXECUTION_*/CONTROL_PLATFORM_* 配置在服务器 .env。
  aeos-reasoning-agent:
    image: aeos-reasoning-agent:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      EXECUTION_AGENT_KEY: reasoning
      EXECUTION_WS_URL: ${EXECUTION_WS_URL:-}
      EXECUTION_PLANE_TOKEN: ${EXECUTION_PLANE_TOKEN:-}
      EXECUTION_AGENT_ID: ${EXECUTION_REASONING_AGENT_ID:-runtime-control-platform-reasoning}
      EXECUTION_AGENT_NAME: ${EXECUTION_REASONING_AGENT_NAME:-公司中台推理智能体}
      EXECUTION_SOURCE_SYSTEM: ${EXECUTION_SOURCE_SYSTEM:-}
      CONTROL_PLATFORM_BASE_URL: ${CONTROL_PLATFORM_BASE_URL:-}
      CONTROL_PLATFORM_REASONING_APP_KEY: ${CONTROL_PLATFORM_REASONING_APP_KEY:-}
      CONTROL_PLATFORM_REASONING_APP_SECRET: ${CONTROL_PLATFORM_REASONING_APP_SECRET:-}
      CONTROL_PLATFORM_REASONING_TIMEOUT_MS: ${CONTROL_PLATFORM_REASONING_TIMEOUT_MS:-180000}
      HEALTH_CHECK_PORT: "8790"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      # 每系统令牌握手（Hub system-token 鉴权；配置后优先于 legacy 根令牌）
      EXECUTION_SYSTEM_ID: ${EXECUTION_SYSTEM_ID:-}
      EXECUTION_SYSTEM_TOKEN: ${EXECUTION_SYSTEM_TOKEN:-}

  # AEOS Hub 执行面订单智能体（agents/order-agent，只注册 update_control_platform_order，写订单四日期字段）。
  # 镜像需单独构建上传（见 agents/README.md）；EXECUTION_*/CONTROL_PLATFORM_* 配置在服务器 .env。
  aeos-order-agent:
    image: aeos-order-agent:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      EXECUTION_AGENT_KEY: order
      # 首期订单智能体仅中台本地使用（Hub 允许列表不含 order）：置空走本地模式，不连 Hub
      EXECUTION_WS_URL: ""
      EXECUTION_PLANE_TOKEN: ${EXECUTION_PLANE_TOKEN:-}
      EXECUTION_AGENT_ID: ${EXECUTION_ORDER_AGENT_ID:-runtime-control-platform-order}
      EXECUTION_AGENT_NAME: ${EXECUTION_ORDER_AGENT_NAME:-公司中台订单智能体}
      EXECUTION_SOURCE_SYSTEM: ${EXECUTION_SOURCE_SYSTEM:-}
      CONTROL_PLATFORM_BASE_URL: ${CONTROL_PLATFORM_BASE_URL:-}
      CONTROL_PLATFORM_ORDER_APP_KEY: ${CONTROL_PLATFORM_ORDER_APP_KEY:-}
      CONTROL_PLATFORM_ORDER_APP_SECRET: ${CONTROL_PLATFORM_ORDER_APP_SECRET:-}
      CONTROL_PLATFORM_TIMEOUT_MS: ${CONTROL_PLATFORM_TIMEOUT_MS:-15000}
      HEALTH_CHECK_PORT: "8790"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_ADMIN_TOKEN: ${AGENT_ADMIN_TOKEN:-}
      # 每系统令牌握手（Hub system-token 鉴权；配置后优先于 legacy 根令牌）
      EXECUTION_SYSTEM_ID: ${EXECUTION_SYSTEM_ID:-}
      EXECUTION_SYSTEM_TOKEN: ${EXECUTION_SYSTEM_TOKEN:-}
