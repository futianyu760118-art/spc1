<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>下周排产计划</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:#f3f5f8;color:#1f2329;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;font-size:13px}
  .top{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px}
  .top h1{margin:0;font-size:16px;font-weight:700}
  .top p{margin:3px 0 0;color:#8c8c8c;font-size:11px}
  .wrap{max-width:1200px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:14px}
  .meta{color:#595959;font-size:12px;margin-bottom:12px;line-height:1.8}
  .meta b{color:#262626}
  .notice{background:#fffbe6;border:1px solid #ffe58f;border-left:3px solid #faad14;color:#614700;padding:8px 10px;border-radius:2px;font-size:12px;margin-bottom:12px}
  .summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{border:1px solid #e8e8e8;border-radius:4px;padding:8px 10px;background:#fcfcfc}
  .stat .label{color:#8c8c8c;font-size:11px}.stat .value{font-size:20px;font-weight:700;margin-top:3px}
  .stat.blue .value{color:#1677ff}.stat.green .value{color:#389e0d}
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
  .day{border:1px solid #e8e8e8;border-radius:4px;background:#fff;padding:7px 8px;text-align:left;cursor:pointer}
  .day.active{border-color:#1677ff;background:#f0f7ff}
  .day .wd{color:#8c8c8c;font-size:10px}.day .dt{font-weight:700;font-size:12px;margin-top:1px}
  .day .sum{color:#8c8c8c;font-size:10px;margin-top:4px;display:flex;justify-content:space-between;gap:4px}
  .table-wrap{overflow-x:auto;border:1px solid #f0f0f0;border-radius:2px}
  table{width:100%;border-collapse:collapse;min-width:980px}
  th{text-align:left;padding:8px;background:#fafafa;color:#595959;font-size:11px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid #f5f5f5;font-size:12px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .mono{font-family:Consolas,monospace;font-size:11px;color:#434343}
  .name{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10px;border:1px solid}
  .tag.assembly{color:#1677ff;background:#e6f4ff;border-color:#91caff}
  .tag.packaging{color:#389e0d;background:#f6ffed;border-color:#b7eb8f}
  .status{font-size:11px}.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#52c41a;margin-right:4px}
  .status.warn{color:#d46b08}.status.warn::before{background:#faad14}
  .status.risk{color:#cf1322}.status.risk::before{background:#ff4d4f}
  .continue{margin-left:4px;padding:0 4px;border:1px solid #d9d9d9;border-radius:2px;color:#8c8c8c;font-size:10px}
  .empty{padding:36px 10px;text-align:center;color:#8c8c8c}
  .empty strong{display:block;color:#595959;margin-bottom:6px}
  .error{background:#fff2f0;border:1px solid #ffccc7;color:#cf1322;padding:10px;border-radius:4px;margin-bottom:12px}
  .foot{margin-top:10px;color:#bfbfbf;font-size:10px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
  .toolbar label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#595959}
  .toolbar button{border:1px solid #d9d9d9;background:#fff;color:#1f2329;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}
  .toolbar button.primary{background:#1677ff;border-color:#1677ff;color:#fff}
  .check-col{width:34px;text-align:center}
  #printArea{display:none}
  @media(max-width:820px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:15px}}
  @media print{
    body{background:#fff}
    .top{padding:0 0 8px;border-bottom:1px solid #ddd}
    .wrap{max-width:none;padding:0}
    .card{border:0;padding:0}
    .notice,.days,.toolbar,.foot,.error{display:none!important}
    .summary{grid-template-columns:repeat(5,1fr)}
    .table-wrap{overflow:visible;border:0}
    table{min-width:0;font-size:10px}
    th,td{padding:4px 5px}
    .check-col{display:none!important}
    tr.print-hide{display:none!important}
    body.print-mode-week .wrap{display:none!important}
    body.print-mode-week #printArea{display:block!important}
    #printArea .print-day{break-inside:avoid;margin-bottom:14px}
    #printArea h2{font-size:16px;margin:0 0 6px}
    #printArea h3{font-size:12px;margin:12px 0 5px;color:#333}
    #printArea .print-meta{font-size:10px;color:#666;margin-bottom:8px}
    #printArea table{width:100%;border-collapse:collapse;min-width:0}
    #printArea th,#printArea td{border:1px solid #ddd;padding:3px 4px;font-size:9px}
    #printArea th{background:#f5f5f5;text-align:left}
  }
</style>
</head>
<body>
<div class="top">
  <h1>下周排产计划</h1>
  <p>数据来自 SPC 系统（只读）</p>
</div>
<div class="wrap">
  <div class="card">
    <div id="errorBox"></div>
    <div class="notice">当前为测试查看页，数据来自已发布快照；只展示排产字段，不含工价、金额和客户信息。</div>
    <div class="meta" id="meta">正在加载...</div>
    <div class="summary" id="summary"></div>
    <div class="days" id="days"></div>
    <div class="toolbar">
      <label><input type="checkbox" id="selectAllRows" /> 全选当前日</label>
      <button type="button" class="primary" id="printSelected">打印选中</button>
      <button type="button" id="printAll">打印当前日全部</button>
      <button type="button" id="printWeek">打印本周全部</button>
    </div>
    <div id="tableArea"></div>
    <div class="foot">SPC 周计划快照 · 只读</div>
  </div>
</div>
<div id="printArea"></div>
<script>
const params = new URLSearchParams(location.search);
const pathParts = location.pathname.split("/").filter(Boolean);
const token = params.get("token") || (pathParts[0] === "weekly-share" ? pathParts[1] : null);
let snapshotId = params.get("snapshot_id");
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString("zh-CN");
const stageLabel = { assembly: "组装", packaging: "包装" };
let currentDate = "";
let data = null;
const selected = new Set();

function showError(msg) {
  $("errorBox").innerHTML = `<div class="error">${msg}</div>`;
  $("meta").textContent = "";
}

function statusTag(status) {
  const cls = status === "risk" ? "risk" : status === "warn" ? "warn" : "";
  return `<span class="status ${cls}">${status === "risk" ? "超负荷" : status === "warn" ? "注意" : "正常"}</span>`;
}

function renderSummary() {
  const s = data.summary || {};
  const h = s.stage_hours || {};
  const cards = [
    ["订单数", fmt(s.order_count), "blue"],
    ["订单行数", fmt(s.line_count), ""],
    ["总数量", fmt(s.total_qty), "blue"],
    ["组装人时", Number(h.assembly || 0).toFixed(1), ""],
    ["包装人时", Number(h.packaging || 0).toFixed(1), "green"],
  ];
  $("summary").innerHTML = cards.map(([label, value, cls]) =>
    `<div class="stat ${cls}"><div class="label">${label}</div><div class="value">${value}</div></div>`
  ).join("");
}

function renderDays() {
  $("days").innerHTML = (data.days || []).map((day) =>
    `<button class="day ${day.date === currentDate ? "active" : ""}" data-date="${day.date}">
      <div class="wd">${day.weekday}</div><div class="dt">${day.date.slice(5)}</div>
      <div class="sum"><span>${fmt(day.total_qty)} 件</span><span>${day.line_count} 行</span></div>
    </button>`
  ).join("");
  document.querySelectorAll(".day").forEach((el) => el.addEventListener("click", () => {
    currentDate = el.dataset.date;
    selected.clear();
    renderDays();
    renderTable();
  }));
}

function rowHtml(r, date, withCheck = true) {
  const key = `${date}-${r.order_no}-${r.line_no}-${r.stage}`;
  return `<tr>
    ${withCheck ? `<td class="check-col"><input type="checkbox" class="row-check" data-key="${key}" ${selected.has(key) ? "checked" : ""} /></td>` : ""}
    <td class="mono">${date.slice(5)}</td>
    <td class="mono">${r.order_no}</td>
    <td class="mono">${r.line_no}</td>
    <td class="mono name" title="${r.product_code || ""}">${r.product_code || "-"}</td>
    <td><div class="name" title="${r.product_name || ""}">${r.product_name || "-"}</div></td>
    <td class="mono name" title="${r.bom_no || ""}">${r.bom_no || "-"}</td>
    <td><span class="tag ${r.stage}">${stageLabel[r.stage] || r.stage_label || r.stage}</span></td>
    <td style="text-align:right">${fmt(r.quantity)}</td>
    <td style="text-align:right">${r.manpower}</td>
    <td style="text-align:right">${r.daily_work_hours}h</td>
    <td>${statusTag(r.status)}${r.continued_from_prev_week ? '<span class="continue">延续</span>' : ""}</td>
    <td style="color:#8c8c8c">${r.remark || "-"}</td>
  </tr>`;
}

function renderTable() {
  const day = (data.days || []).find((d) => d.date === currentDate) || { rows: [] };
  if (!day.rows.length) {
    $("tableArea").innerHTML = `<div class="empty"><strong>当日无排产</strong>请切换其他日期。</div>`;
    return;
  }
  $("tableArea").innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th class="check-col"></th><th>日期</th><th>订单号</th><th>行号</th><th>产品编码</th><th>产品名称</th><th>BOM</th><th>工序</th><th style="text-align:right">数量</th><th style="text-align:right">人数</th><th style="text-align:right">日工时</th><th>状态</th><th>备注</th></tr></thead>
    <tbody>${day.rows.map((r) => rowHtml(r, day.date, true)).join("")}</tbody></table></div>`;

  document.querySelectorAll(".row-check").forEach((el) => {
    el.addEventListener("change", () => {
      if (el.checked) selected.add(el.dataset.key);
      else selected.delete(el.dataset.key);
      updateSelectAll();
    });
  });
  updateSelectAll();
}

function updateSelectAll() {
  const checks = [...document.querySelectorAll(".row-check")];
  const all = document.getElementById("selectAllRows");
  if (!all) return;
  all.checked = checks.length > 0 && checks.every((el) => el.checked);
  all.indeterminate = checks.some((el) => el.checked) && !all.checked;
}

function printSelected() {
  if (!selected.size) {
    alert("请先勾选需要打印的订单");
    return;
  }
  document.body.classList.remove("print-mode-week");
  document.querySelectorAll("tbody tr").forEach((tr) => {
    const cb = tr.querySelector(".row-check");
    tr.classList.toggle("print-hide", !cb || !cb.checked);
  });
  window.print();
}

function printAll() {
  document.body.classList.remove("print-mode-week");
  document.querySelectorAll("tbody tr").forEach((tr) => tr.classList.remove("print-hide"));
  window.print();
}

function printWeek() {
  const days = data.days || [];
  const stageHours = data.summary?.stage_hours || {};
  const html = [`<div class="print-day">
    <h2>下周排产计划 ${data.week_start} ~ ${data.week_end}</h2>
    <div class="print-meta">快照 ${data.snapshot_no || "-"} ｜ 订单 ${data.summary?.order_count || 0} 个 ｜ 明细 ${data.summary?.line_count || 0} 行 ｜ 数量 ${fmt(data.summary?.total_qty)} 件 ｜ 组装 ${Number(stageHours.assembly || 0).toFixed(1)} 人时 ｜ 包装 ${Number(stageHours.packaging || 0).toFixed(1)} 人时</div>
  </div>`];
  days.forEach((day) => {
    html.push(`<div class="print-day">
      <h3>${day.date} ${day.weekday}</h3>
      ${day.rows.length ? `<table>
        <thead><tr><th>日期</th><th>订单号</th><th>行号</th><th>产品编码</th><th>产品名称</th><th>BOM</th><th>工序</th><th style="text-align:right">数量</th><th style="text-align:right">人数</th><th style="text-align:right">日工时</th><th>状态</th><th>备注</th></tr></thead>
        <tbody>${day.rows.map((r) => rowHtml(r, day.date, false)).join("")}</tbody>
      </table>` : `<div class="print-meta">当日无排产</div>`}
    </div>`);
  });
  $("printArea").innerHTML = html.join("");
  document.body.classList.add("print-mode-week");
  window.print();
}

window.addEventListener("afterprint", () => {
  document.body.classList.remove("print-mode-week");
  document.querySelectorAll("tbody tr").forEach((tr) => tr.classList.remove("print-hide"));
});

function render() {
  $("meta").innerHTML = `周期 <b>${data.week_start}</b> ~ <b>${data.week_end}</b>
    ｜ 快照 <b>${data.snapshot_no || "-"}</b>
    ｜ 发布时间 <b>${(data.published_at || "").replace("T", " ").slice(0, 19) || "-"}</b>`;
  renderSummary();
  renderDays();
  renderTable();
}

async function main() {
  if (!token) {
    showError("缺少分享凭证，请从企业微信重新打开。");
    return;
  }
  try {
    const verifyResp = await fetch(`/api/v1/share/${encodeURIComponent(token)}`);
    if (!verifyResp.ok) throw new Error(`分享验证失败（${verifyResp.status}）`);
    const verify = await verifyResp.json();
    const access = verify.data?.access_token;
    if (!access) throw new Error(verify.data?.detail || "分享凭证无效");
    if (!snapshotId) snapshotId = verify.data?.target_params?.snapshot_id;
    if (!snapshotId) throw new Error("缺少快照编号");
    const snapResp = await fetch(`/api/v1/production/weekly-capacity/snapshots/${snapshotId}`, {
      headers: { Authorization: `Bearer ${access}` },
    });
    if (!snapResp.ok) throw new Error(`快照加载失败（${snapResp.status}）`);
    const snap = await snapResp.json();
    data = snap.data;
    if (!data || !data.days) throw new Error("快照数据为空");
    const first = data.days.find((d) => d.rows && d.rows.length) || data.days[0];
    currentDate = first?.date || "";
    render();
  } catch (err) {
    showError(err.message || "加载失败，请稍后重试。");
  }
}

document.getElementById("printSelected").addEventListener("click", printSelected);
document.getElementById("printAll").addEventListener("click", printAll);
document.getElementById("printWeek").addEventListener("click", printWeek);
document.getElementById("selectAllRows").addEventListener("change", (event) => {
  document.querySelectorAll(".row-check").forEach((el) => {
    el.checked = event.target.checked;
    if (el.checked) selected.add(el.dataset.key);
    else selected.delete(el.dataset.key);
  });
  updateSelectAll();
});

main();
</script>
</body>
</html>
